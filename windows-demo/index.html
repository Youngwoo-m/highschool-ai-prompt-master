<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Windows 설치와 스킬 실행 기록</title><style>*{box-sizing:border-box}body{margin:0;background:#f4faf7;color:#173e45;font-family:Arial,"Malgun Gothic",sans-serif}header{padding:20px 32px 12px;background:#fff9eb;border-bottom:1px solid #dbeae2}.badge{font-size:17px;font-weight:900;color:#168080}h1{font-size:32px;line-height:1.2;margin:12px 0;font-weight:900;white-space:nowrap}nav{display:flex;gap:10px}button{border:0;border-radius:12px;padding:12px 20px;color:#17454e;background:#dcefe8;font-size:20px;font-weight:900;cursor:pointer}button[aria-pressed=true]{background:#167f87;color:white}main{padding:18px 32px}.steps{display:flex;gap:10px;margin-bottom:14px}.steps button{font-size:18px;background:#e5efff}.steps button[aria-pressed=true]{background:#356b9c;color:#fff}section{height:414px;border-radius:18px;border:1px solid #dcebe3;background:white;padding:18px;overflow:auto}h2{font-size:23px;margin:0 0 12px;font-weight:900}pre{font:18px/1.6 Consolas,"Malgun Gothic",monospace;white-space:pre-wrap;word-break:break-word;margin:0 0 14px}code{font-size:18px}article{padding:12px;border-radius:12px;background:#f2f7f6;margin:0 0 14px}.status{color:#147361;font-weight:900;margin-bottom:6px}.source-image{display:block;max-width:100%;height:336px;object-fit:contain;margin:auto}.report-image{max-height:345px;max-width:49%;object-fit:contain}.pair{display:flex;gap:18px;justify-content:center}iframe{border:0;width:100%;height:340px}footer{font-size:14px;line-height:1.5;margin-top:12px}a{color:#147f8b;font-weight:bold}footer p{margin:4px 0}.claim{font-weight:900;color:#916114}section p{font-size:20px;font-weight:700;line-height:1.7}</style><header><div class="badge">공식 화면 · 실제 실행완료 기록 조회 / 터미널 녹화 아님</div><h1 id="title"></h1><nav aria-label="실습 선택"><button data-lesson="codex">Codex</button><button data-lesson="claude">Claude Code</button><button data-lesson="prompt">prompt-master</button><button data-lesson="hwpx">HWPX 보고서</button></nav></header><main><div class="steps" aria-label="단계 선택"><button data-step="source">① 공식 화면</button><button data-step="install">② 설치 기록</button><button data-step="input">③ 입력 예시</button><button data-step="output">④ 출력 기록</button><button data-step="result">⑤ 결과 확인</button></div><section id="panel" aria-live="polite"></section><footer><a id="source" target="_blank" rel="noopener"></a><p id="notes"></p><p class="claim">녹화일 2026-11-10 · 로그인·인증정보 입력은 미포함임</p></footer></main><script>
let lessons,current,step='source';const $=s=>document.querySelector(s);function el(tag,text){const x=document.createElement(tag);x.textContent=text;return x}function show(){const d=current;$('#title').textContent=d.title;document.querySelectorAll('[data-lesson]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lesson===d.id));document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.step===step));$('#source').textContent=d.source;$('#source').href=d.source;$('#notes').textContent=d.notes;const panel=$('#panel');panel.replaceChildren();if(step==='source'){panel.append(el('h2','공식 웹페이지에서 확인한 화면임'));let im=el('img','');im.className='source-image';im.src='official-'+d.id+'.jpg';im.alt=d.title+' 공식 웹 캡처';panel.append(im)}if(step==='install'){panel.append(el('h2','실제로 실행한 명령과 완료 기록임'));for(const r of d.install){let ar=el('article','');ar.append(el('code',r.command));let st=el('div',r.status);st.className='status';ar.append(st,el('pre',r.output));panel.append(ar)}}if(step==='input'){panel.append(el('h2',d.id==='hwpx'?'재사용할 보고서 요청 예시임':'실제로 입력한 요청문임'));panel.append(el('pre',d.input))}if(step==='output'){panel.append(el('h2',d.id==='hwpx'?'실제 사용한 양식 치환 매핑임':'실제 프로그램이 반환한 응답임'));panel.append(el('pre',d.output))}if(step==='result'){if(d.result==='hello.html'){panel.append(el('h2','실제 응답 코드를 저장한 웹페이지임'));const f=document.createElement('iframe');f.src='hello.html';f.title='hello.html 실행 결과';panel.append(f)}else if(d.result==='report'){panel.append(el('h2','실제 한글 화면 캡처와 4쪽 보고서임'));let pair=el('div','');pair.className='pair';for(const src of ['한글_결과본문_실제화면.jpg','report-3.png']){let im=el('img','');im.className='report-image';im.src=src;im.alt=src==='report-3.png'?'한글에서 내보낸 PDF의 본문':'실제 한글 프로그램 화면 / 계정 제목줄 제외';pair.append(im)}panel.append(pair);let a=el('a','작성 HWPX 내려받기');a.href='양식맞춤_AI실습자료_제작보고서.hwpx';panel.append(a)}else{panel.append(el('h2','출력 프롬프트의 요구사항을 확인함'));panel.append(el('p','캐릭터 선택 · 이동 · 점프 · 충돌 · 재시작'));panel.append(el('p','원본 이용 조건 · 결과 파일 · 검증 기준'));panel.append(el('pre',d.output.slice(-1600)))}}panel.scrollTop=0}
fetch('lessons.json').then(r=>r.json()).then(data=>{lessons=data;current=lessons.find(x=>x.id===location.hash.slice(1))||lessons[0];show()});document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>{current=lessons.find(x=>x.id===b.dataset.lesson);location.hash=current.id;step='source';show()});document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{step=b.dataset.step;show()});</script></html>
