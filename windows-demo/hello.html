<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고교 AI 첫 실습</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #d9fff0;
      color: #123d32;
      font-family: system-ui, sans-serif;
    }

    main {
      width: min(100%, 760px);
      padding: clamp(32px, 7vw, 72px);
      border: 2px solid #a5e8cf;
      border-radius: 28px;
      background: #f7fffb;
      text-align: center;
      box-shadow: 0 16px 48px rgb(18 61 50 / 8%);
    }

    h1 {
      margin: 0 0 24px;
      font-size: clamp(36px, 7vw, 64px);
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: -0.04em;
      word-break: keep-all;
    }

    p {
      margin: 0;
      font-size: clamp(18px, 3vw, 26px);
      line-height: 1.7;
      word-break: keep-all;
    }
  </style>
</head>
<body>
  <main>
    <h1>고교 AI 첫 실습</h1>
    <p>오늘의 목표: 요청하고 확인함</p>
  </main>
</body>
</html>
